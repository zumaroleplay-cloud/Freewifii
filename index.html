<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1a2b">
<title>Free WiFi</title>

<style>
  :root {
    --dasar: #0e1a2b;
    --garis: #28405e;
    --teks: #e9eff7;
    --redup: #8fa3bb;
    --emas: #f2b84b;
    --emas-tua: #d9992a;
    --sinyal: #bfe0ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: "Bahnschrift", "DIN Alternate", "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--dasar);
    color: var(--teks);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-radial-gradient(
      circle at 50% 42%,
      transparent 0 58px,
      rgba(150, 195, 240, 0.07) 58px 59px
    );
    pointer-events: none;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 100%, rgba(242, 184, 75, 0.08), transparent 60%);
    pointer-events: none;
  }

  .layar {
    position: relative;
    z-index: 1;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 26px calc(env(safe-area-inset-bottom, 0px) + 24px);
  }

  .tengah { width: 100%; max-width: 380px; }

  .cincin { width: 168px; height: 168px; display: block; margin: 0 auto; }
  .cincin .alas { fill: none; stroke: var(--garis); stroke-width: 5; }
  .cincin .gelombang path { fill: none; stroke: var(--sinyal); stroke-width: 4; stroke-linecap: round; }
  .cincin .gelombang circle { fill: var(--sinyal); }

  h1 {
    margin-top: 26px;
    font-size: clamp(2.6rem, 11vw, 3.8rem);
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.025em;
  }

  .ket {
    margin-top: 12px;
    color: var(--redup);
    font-size: 1.02rem;
  }

  .tombol {
    margin-top: 30px;
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--emas);
    color: #231805;
    border: 0;
    border-radius: 14px;
    font: inherit;
    font-weight: 700;
    font-size: 1.1rem;
    padding: 17px 22px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .tombol:hover { background: #f7c565; }
  .tombol:active { transform: translateY(1px); background: var(--emas-tua); }
  .tombol:focus-visible { outline: 2px solid var(--emas); outline-offset: 3px; }

  /* tampilan hasil setelah connect ditekan */
  .hasil {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: #0a0f18;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 22px calc(env(safe-area-inset-bottom, 0px) + 20px);
    text-align: center;
  }
  .hasil.tampil { display: flex; }

  .hasil img {
    display: block;
    width: min(78vw, 340px);
    max-height: 58dvh;
    object-fit: cover;
    border-radius: 18px;
    border: 3px solid var(--emas);
  }

  .hasil p {
    max-width: 22ch;
    font-size: clamp(1.5rem, 6.4vw, 2.3rem);
    font-weight: 800;
    line-height: 1.12;
    letter-spacing: -0.01em;
    color: var(--emas);
  }

  footer {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    left: 0;
    right: 0;
    text-align: center;
    color: var(--redup);
    font-size: 0.78rem;
    opacity: 0.8;
  }
</style>
</head>
